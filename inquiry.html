<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="grid">
    <div class="wrapper">
      <header>
        <div class="banner">
          <img src="images/logo-nav.png" alt="Cannons Coffee Logo, Beans of Joy">
          <h1>Cannons Coffee</h1>
        </div>
        <nav>
          <ul>
            <li><a href="inquiry.html">Inquiry</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="index.html">Home</a></li>
            <li><a href="latte.html">Coffee</a></li>
            <li><a href="https://www.madhouse.coffee/" target="_blank">About</a></li>
            <li><a href="mailto:tina.2026.brown@gmail.com">Contact</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <br><br>
        <div class="inquiry">
          <form id="form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="user_name" />
            <br><br>

            <label for="mail">Email:</label>
            <input type="email" id="mail" name="user_email" />
            <br><br>

            <label for="telNo">Phone number:</label>
            <input id="telNo" name="telNo" type="tel" />
            <br><br>

            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments"></textarea>
            <br><br>

            <label for="flavor">Coffee flavor:</label>
            <select id="flavor" name="flavor">
              <option value="original">original roast</option>
              <option value="hazelnut">hazelnut</option>
              <option value="caramel">caramel</option>
            </select>
            <br><br>

            <input type="radio" id="buy" name="question" value="buy" required>
            <label for="buy">I am buying coffee</label>

            <input type="radio" id="employ" name="question" value="employ" required>
            <label for="employ">I am seeking employment</label>
          <br><br>

          <p class="button">
            <button type="submit">Submit</button>
          </p>
          </form>
        </div>
        <div class="container"></div>
      </main>

      <footer>
        <img src="images/logo-footer.png" alt="Cannons Coffee" />
        <p>&copy; 2026 Cannons Coffee. All Rights Reserved</p>
      </footer>
    </div>
  </div>
  <script src="js/custom-inquiry.js"></script>
</body>

</html>
